name: V92 offline regression
on:
  pull_request:
  push:
    branches:
      - fix/phase343-release-state-contract-20261110
      - fix/phase378-dispatch-correlation
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-automation.txt
      - run: python -m compileall -q automation/v92
      - run: python -m unittest discover -s tests/v92
