name: GPT Quant Phase 3.7.19.3.14 - Freshness Recovery Evidence Producer Invocation Persistence Execution Path Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: freshness-recovery-invocation-persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile diagnostic
        run: python -m py_compile automation/v92/phase3719314_phase375_freshness_recovery_evidence_producer_invocation_persistence_execution_path_diagnostic.py

      - name: Run read-only diagnostic
        run: python automation/v92/phase3719314_phase375_freshness_recovery_evidence_producer_invocation_persistence_execution_path_diagnostic.py

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/phase3719314/phase3719314_invocation_persistence_path.md ]; then
            cat artifacts/phase3719314/phase3719314_invocation_persistence_path.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3719314-freshness-recovery-invocation-persistence
          path: artifacts/phase3719314
          if-no-files-found: warn
          retention-days: 90
