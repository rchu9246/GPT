name: GPT Quant V9.1 Paper Trading 404 Fix v1 - Schema Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-trading-schema-check-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Paper Trading session schema endpoint
        run: python automation/gpt_quant_v91_paper_trading_schema_check_v1.py