name: GPT Quant V9.2 Paper Trading Phase 3.4.1 - Daily Qualification Automation

on:
  workflow_dispatch:
    inputs:
      strategy_version:
        description: Strategy version
        required: true
        default: V9.1
        type: string
  schedule:
    # 09:10 UTC = 17:10 Taiwan time. Weekdays only.
    # Qualification reads completed daily snapshots; it does not create a PASS day itself.
    - cron: "10 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: gpt-quant-v92-phase341-daily-qualification
  cancel-in-progress: false

jobs:
  daily-qualification:
    name: daily-qualification-evaluation-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRATEGY_VERSION: ${{ inputs.strategy_version || 'V9.1' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Phase 3.4.1 safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f automation/v92/paper_trading_phase34_human_approval_release.py
          test -f automation/v92/paper_trading_phase341_daily_qualification.py
          grep -q 'SHADOW_ONLY_NO_BROKER' automation/v92/paper_trading_phase341_daily_qualification.py
          grep -q 'automatic_approval.*False' automation/v92/paper_trading_phase341_daily_qualification.py

      - name: Run Phase 3.4.1 Daily Qualification
        run: python automation/v92/paper_trading_phase341_daily_qualification.py

      - name: Upload Phase 3.4.1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase341-daily-qualification-${{ github.run_id }}
          path: phase341_output/
          if-no-files-found: warn
          retention-days: 14
