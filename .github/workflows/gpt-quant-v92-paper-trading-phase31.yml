name: GPT Quant V9.2 Paper Trading Phase 3.1 - Production Operations Automation + Incident Guard

on:
  workflow_dispatch:
    inputs:
      strategy_version:
        description: "V9 or V9.1"
        required: true
        default: "V9.1"
        type: choice
        options:
          - V9
          - V9.1
  schedule:
    # 14:55 Asia/Taipei = 06:55 UTC, Monday-Friday
    - cron: "55 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: gpt-quant-v92-paper-trading-phase31
  cancel-in-progress: false

jobs:
  production-operations-incident-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      PAPER_STRATEGY_VERSION: ${{ inputs.strategy_version || 'V9.1' }}
      PAPER_TRADING_MODE: SHADOW_ONLY_NO_BROKER

      PHASE30_REQUIRED_PASS_DAYS: ${{ vars.PHASE27_REQUIRED_PASS_DAYS || '5' }}
      PHASE30_MAX_MARKET_STALE_DAYS: ${{ vars.PHASE27_MAX_MARKET_STALE_DAYS || '3' }}
      PHASE30_MIN_EQUITY: ${{ vars.PHASE27_MIN_EQUITY || '0' }}
      PHASE30_MAX_OPEN_POSITIONS: ${{ vars.PAPER_MAX_OPEN_POSITIONS || '10' }}
      PHASE30_MAX_DAILY_DRAWDOWN: ${{ vars.PHASE29_MAX_DAILY_DRAWDOWN || '0.08' }}

      PHASE31_FAIL_CLOSED: "true"
      PHASE31_RECOVERY_REQUIRED_PASSES: ${{ vars.PHASE31_RECOVERY_REQUIRED_PASSES || '2' }}
      PHASE31_MAX_MARKET_STALE_DAYS: ${{ vars.PHASE27_MAX_MARKET_STALE_DAYS || '3' }}
      PHASE31_MAX_DAILY_DRAWDOWN: ${{ vars.PHASE29_MAX_DAILY_DRAWDOWN || '0.08' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Phase 3.1 environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "::error::Missing SUPABASE_URL"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          test -f automation/v92/paper_trading_phase30_control_center.py || {
            echo "::error::Missing Phase 3.0 control center"
            exit 1
          }
          test -f automation/v92/paper_trading_phase31_incident_guard.py || {
            echo "::error::Missing Phase 3.1 incident guard"
            exit 1
          }

      - name: Run Phase 3.1 Operations Automation + Incident Guard
        shell: bash
        run: |
          set +e
          python automation/v92/paper_trading_phase31_incident_guard.py
          RC=$?
          if [ -f phase31_summary.md ]; then
            cat phase31_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$RC"

      - name: Upload Phase 3.1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase31-incident-guard-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 90
          path: |
            phase30_result.json
            phase30_summary.md
            dashboard/phase30_control_center.html
            phase31_result.json
            phase31_incidents.json
            phase31_summary.md
