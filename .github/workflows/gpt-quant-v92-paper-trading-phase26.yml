name: GPT Quant V9.2 Paper Trading Phase 2.6 - Automatic Daily Trading Cycle
on:
  workflow_dispatch:
    inputs:
      strategy_version:
        required: true
        default: "V9.1"
        type: choice
        options: [V9, V9.1]
  schedule:
    - cron: "35 6 * * 1-5"
permissions: {contents: read}
concurrency:
  group: gpt-quant-v92-paper-trading-phase26
  cancel-in-progress: false
jobs:
  automatic-daily-trading-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      PAPER_STRATEGY_VERSION: ${{ inputs.strategy_version || 'V9.1' }}
      PAPER_TRADING_MODE: SHADOW_ONLY_NO_BROKER
      PAPER_SCORE_THRESHOLD: ${{ vars.PAPER_SCORE_THRESHOLD || '65' }}
      PAPER_INITIAL_CAPITAL: ${{ vars.PAPER_INITIAL_CAPITAL || '1000000' }}
      PAPER_POSITION_SIZE: ${{ vars.PAPER_POSITION_SIZE || '0.10' }}
      PAPER_MAX_SINGLE_POSITION: ${{ vars.PAPER_MAX_SINGLE_POSITION || '0.15' }}
      PHASE25_FAIL_CLOSED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip requests
      - name: Run Phase 2.6
        run: python automation/v92/paper_trading_phase26_daily_cycle.py
      - name: Publish summary
        if: always()
        run: test ! -f phase26_summary.md || cat phase26_summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase26-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            phase26_result.json
            phase26_summary.md
            phase25_result.json
            phase25_summary.md
            phase25_logs/
