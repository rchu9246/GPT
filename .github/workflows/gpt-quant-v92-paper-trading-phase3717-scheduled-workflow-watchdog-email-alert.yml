name: GPT Quant Phase 3.7.17 - Scheduled Workflow Watchdog Email Alert
on:
  workflow_dispatch:
  schedule:
    - cron: "25 19 * * 1-5"
permissions:
  contents: read
  actions: read
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile automation/v92/paper_trading_phase3717_scheduled_workflow_watchdog_email_alert.py
      - name: Run watchdog
        id: watchdog
        continue-on-error: true
        run: python automation/v92/paper_trading_phase3717_scheduled_workflow_watchdog_email_alert.py
      - name: Publish summary
        if: always()
        run: |
          if [ -f artifacts/phase3717/phase3717_summary.md ]; then cat artifacts/phase3717/phase3717_summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3717-watchdog-evidence
          path: artifacts/phase3717
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce Phase 3.7.17 terminal-state evidence contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # PHASE37172_WATCHDOG_TERMINAL_STATE_EVIDENCE_CONTRACT_ALIGNMENT
          result_json="artifacts/phase3717/phase3717_result.json"

          if [ ! -f "$result_json" ]; then
            echo "::error::Phase 3.7.17 canonical result JSON is missing."
            exit 1
          fi

          state=$(python -c "import json,sys; print(str(json.load(open(sys.argv[1], encoding='utf-8')).get('state','')))" "$result_json")

          if [ -z "$state" ]; then
            echo "::error::Phase 3.7.17 result JSON is missing state."
            exit 1
          fi

          case "$state" in
            WATCHDOG_ALL_SCHEDULED_WORKFLOWS_HEALTHY)
              echo "Phase 3.7.17 watchdog terminal state: $state"
              exit 0
              ;;
            WATCHDOG_ALERT_DETECTED)
              echo "Phase 3.7.17 watchdog terminal state: $state"
              echo "Alert evidence/email remain preserved."
              exit 0
              ;;
            *)
              echo "::error::Unrecognized Phase 3.7.17 watchdog terminal state: $state"
              exit 1
              ;;
          esac
