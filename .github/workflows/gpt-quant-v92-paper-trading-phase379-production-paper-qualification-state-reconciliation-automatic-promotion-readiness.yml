name: GPT Quant Phase 3.7.9 - Production Paper Qualification State Reconciliation Automatic Promotion Readiness

on:
  workflow_dispatch:
  schedule:
    # Weekdays 15:35 UTC / 23:35 Asia-Taipei, after Phase 3.7.8.
    - cron: "35 15 * * 1-5"

permissions:
  contents: read
  actions: read

jobs:
  qualification-state-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GPT_QUANT_PORTFOLIO_ID: V92_PRODUCTION_PAPER_V91
      GPT_QUANT_STRATEGY_VERSION: V9.1
      PHASE375_RESULT_PATH: artifacts/phase379/input/phase375_result.json
      PHASE376_RESULT_PATH: artifacts/phase379/input/phase376_result.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Phase 3.7.9
        run: python -m py_compile automation/v92/paper_trading_phase379_production_paper_qualification_state_reconciliation_automatic_promotion_readiness.py

      - name: Validate readiness safety contract
        shell: bash
        run: |
          set -euo pipefail
          f="automation/v92/paper_trading_phase379_production_paper_qualification_state_reconciliation_automatic_promotion_readiness.py"
          grep -q 'BROKER_ORDER_SUBMISSION_ENABLED = False' "$f"
          grep -q 'REAL_MONEY_TRADING_ENABLED = False' "$f"
          grep -q 'HISTORICAL_REWRITE_ALLOWED = False' "$f"
          grep -q 'PROMOTION_READINESS_READY' "$f"
          grep -q 'PROMOTION_READINESS_WAITING' "$f"
          grep -q 'PROMOTION_READINESS_BLOCKED' "$f"
          echo "Phase 3.7.9 readiness safety contract: PASS"

      - name: Resolve latest Phase 3.7.5 qualification evidence
        id: resolve375
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase379/input /tmp/phase375
          workflow="gpt-quant-v92-paper-trading-phase375-production-paper-multi-cycle-stability-evidence-qualification.yml"

          run_id="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&status=success&per_page=20" \
            --jq '.workflow_runs[0].id // empty' || true)"

          if [ -z "$run_id" ]; then
            echo "No successful Phase 3.7.5 run found."
            exit 0
          fi

          echo "PHASE375_RUN_ID=$run_id" >> "$GITHUB_ENV"

          artifact_id="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            --jq '.artifacts[] | select(.expired==false) | .id' \
            | head -n 1 || true)"

          if [ -z "$artifact_id" ]; then
            echo "No Phase 3.7.5 artifact found."
            exit 0
          fi

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > /tmp/phase375/evidence.zip

          unzip -o /tmp/phase375/evidence.zip -d /tmp/phase375/unpacked >/dev/null
          result="$(find /tmp/phase375/unpacked -type f -name 'phase375_result.json' | head -n 1 || true)"
          if [ -n "$result" ]; then
            cp "$result" artifacts/phase379/input/phase375_result.json
          fi

      - name: Resolve latest Phase 3.7.6 promotion evidence
        id: resolve376
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase379/input /tmp/phase376
          workflow="gpt-quant-v92-paper-trading-phase376-production-paper-multi-cycle-qualification-promotion-gate.yml"

          run_id="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&status=success&per_page=20" \
            --jq '.workflow_runs[0].id // empty' || true)"

          if [ -z "$run_id" ]; then
            echo "No successful Phase 3.7.6 run found."
            exit 0
          fi

          echo "PHASE376_RUN_ID=$run_id" >> "$GITHUB_ENV"

          artifact_id="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            --jq '.artifacts[] | select(.expired==false) | .id' \
            | head -n 1 || true)"

          if [ -z "$artifact_id" ]; then
            echo "No Phase 3.7.6 artifact found."
            exit 0
          fi

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > /tmp/phase376/evidence.zip

          unzip -o /tmp/phase376/evidence.zip -d /tmp/phase376/unpacked >/dev/null
          result="$(find /tmp/phase376/unpacked -type f -name 'phase376_result.json' | head -n 1 || true)"
          if [ -n "$result" ]; then
            cp "$result" artifacts/phase379/input/phase376_result.json
          fi

      - name: Execute Phase 3.7.9
        id: phase379
        continue-on-error: true
        run: python automation/v92/paper_trading_phase379_production_paper_qualification_state_reconciliation_automatic_promotion_readiness.py

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/phase379/phase379_summary.md ]; then
            cat artifacts/phase379/phase379_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase379-production-paper-promotion-readiness
          path: artifacts/phase379
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce readiness safety result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.phase379.outcome }}" != "success" ]; then
            echo "Phase 3.7.9 promotion readiness is BLOCKED."
            exit 1
          fi
          echo "Phase 3.7.9 promotion readiness is healthy."
