name: V10 Forward Shadow Paper Validation

on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      enable_forward_validation:
        description: "User approval gate for a paper-only forward run"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: v10-forward-shadow-paper
  cancel-in-progress: false

jobs:
  forward-shadow:
    if: github.event_name == 'schedule' || inputs.enable_forward_validation == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore latest append-only forward store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v10_forward_store"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=v10-forward-store&per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/previous-forward-store.zip"
            unzip -q "$RUNNER_TEMP/previous-forward-store.zip" -d "$RUNNER_TEMP/restored-evidence"
          fi
          python -m automation.v10.restore_forward_store --seed artifacts/v10_forward_store --downloaded "$RUNNER_TEMP/restored-evidence" --output "$RUNNER_TEMP/v10_forward_store"
      - name: Verify safety and run one shadow day
        run: |
          set -o pipefail
          python -m unittest discover -s tests/v10 -p "test_v10_*.py" 2>&1 | tee "$RUNNER_TEMP/v10-forward-tests.log"
          python -m automation.v10.forward_daily_run --cache "$RUNNER_TEMP/v10_twse_cache" --store "$RUNNER_TEMP/v10_forward_store" 2>&1 | tee "$RUNNER_TEMP/v10-forward-run.log"
          python -m automation.v10.dashboard_report --store "$RUNNER_TEMP/v10_forward_store" --output "$RUNNER_TEMP/v10_forward_store/dashboard_report.json"
      - name: Preserve append-only shadow evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-forward-store
          path: ${{ runner.temp }}/v10_forward_store
          if-no-files-found: error
          retention-days: 90
      - name: Preserve run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-forward-diagnostics
          path: ${{ runner.temp }}/v10-forward-*.log
          retention-days: 90

