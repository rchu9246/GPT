name: GPT Quant V9 Position Sizing Engine

on:
  workflow_dispatch:
    inputs:
      ranking_id:
        description: "Optional portfolio_rankings_v56 UUID"
        required: false
        type: string
      limit:
        description: "Maximum rankings to process"
        required: true
        default: "20"
        type: string
      max_single_weight:
        description: "Maximum position weight, e.g. 0.10"
        required: true
        default: "0.10"
        type: string
      total_risk_budget:
        description: "Portfolio risk budget multiplier, e.g. 1.00"
        required: true
        default: "1.00"
        type: string

permissions:
  contents: read

concurrency:
  group: gpt-quant-v9-position-sizing
  cancel-in-progress: false

jobs:
  sizing:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GPT Quant V9 Position Sizing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=(
            --limit "${{ inputs.limit }}"
            --max-single-weight "${{ inputs.max_single_weight }}"
            --total-risk-budget "${{ inputs.total_risk_budget }}"
          )
          if [ -n "${{ inputs.ranking_id }}" ]; then
            ARGS+=(--ranking-id "${{ inputs.ranking_id }}")
          fi
          python automation/gpt_quant_v9_position_sizing_engine.py "${ARGS[@]}"

      - name: Verify Position Sizing Writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: ${{ github.workspace }}/automation
        run: |
          python - <<'PY'
          from enterprise2.client import SupabaseRestClient

          client = SupabaseRestClient()
          rows = client.get(
              "gpt_quant_v9_position_sizing_results",
              "order=sizing_date.desc,rank_no.asc&limit=20",
          )
          if not rows:
              raise SystemExit("No position sizing results found")

          for row in rows:
              size = float(row.get("final_position_size") or 0)
              if size < 0 or size > 0.25:
                  raise SystemExit(
                      f"Invalid position size: {size}"
                  )
              if row.get("paper_only") is not True:
                  raise SystemExit("Safety violation: paper_only false")
              if row.get("live_trading_enabled") is not False:
                  raise SystemExit("Safety violation: live trading enabled")
              if row.get("broker_submission_enabled") is not False:
                  raise SystemExit(
                      "Safety violation: broker submission enabled"
                  )

          print(
              "GPT Quant V9 Position Sizing verified:",
              "rows=", len(rows),
              "top_position=", rows[0].get("final_position_size"),
              "top_status=", rows[0].get("sizing_status"),
          )
          PY
