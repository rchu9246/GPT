name: GPT Quant V9.2 Production Paper Trading Phase 1

on:
  workflow_dispatch:
    inputs:
      strategy_version:
        description: "V9 or V9.1"
        required: true
        default: "V9.1"
        type: choice
        options: [V9, V9.1]
  schedule:
    # 14:20 Asia/Taipei, Monday-Friday (06:20 UTC)
    - cron: "20 6 * * 1-5"

permissions:
  contents: read

jobs:
  shadow-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PAPER_STRATEGY_VERSION: ${{ inputs.strategy_version || 'V9.1' }}
      PAPER_INITIAL_CAPITAL: ${{ vars.PAPER_INITIAL_CAPITAL || '1000000' }}
      PAPER_SCORE_THRESHOLD: ${{ vars.PAPER_SCORE_THRESHOLD || '65' }}
      PAPER_POSITION_SIZE: ${{ vars.PAPER_POSITION_SIZE || '0.10' }}
      PAPER_MAX_NEW_ORDERS: ${{ vars.PAPER_MAX_NEW_ORDERS || '5' }}
      PAPER_MAX_OPEN_POSITIONS: ${{ vars.PAPER_MAX_OPEN_POSITIONS || '10' }}
      PAPER_SLIPPAGE_RATE: ${{ vars.PAPER_SLIPPAGE_RATE || '0.001' }}
      PAPER_COMMISSION_RATE: ${{ vars.PAPER_COMMISSION_RATE || '0.001425' }}
      PAPER_TAX_RATE: ${{ vars.PAPER_TAX_RATE || '0.003' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run Shadow Production
        run: python automation/v92/production_paper_trading_phase1.py

      - name: Upload Paper Trading report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-phase1-${{ github.run_number }}
          path: artifacts/paper_trading/
          if-no-files-found: warn
          retention-days: 90
