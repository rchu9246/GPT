name: GPT Quant Phase 3.5.3 - Exact Producer Completion Handoff

on:
  workflow_run:
    workflows: ['GPT Quant Phase 3.4.8.4.5.1 - V9.1 Runtime Market Data Source Discovery Signal Input Contract Fix']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: phase353-handoff-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  handoff:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Use trusted default-branch code, never the triggering run's checkout.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Validate completed producer and dispatch its explicit consumer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/v92/phase353_authority_handoff.py complete
