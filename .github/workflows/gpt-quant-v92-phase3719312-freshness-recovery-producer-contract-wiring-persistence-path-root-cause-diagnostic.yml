name: GPT Quant Phase 3.7.19.3.12 - Freshness Recovery Producer Contract Wiring Persistence Path Root Cause Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: freshness-recovery-contract-wiring
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile diagnostic
        run: python -m py_compile automation/v92/phase3719312_phase375_freshness_recovery_producer_contract_wiring_persistence_path_root_cause_diagnostic.py

      - name: Run read-only wiring diagnostic
        run: python automation/v92/phase3719312_phase375_freshness_recovery_producer_contract_wiring_persistence_path_root_cause_diagnostic.py

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/phase3719312/phase3719312_contract_wiring.md ]; then
            cat artifacts/phase3719312/phase3719312_contract_wiring.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3719312-freshness-recovery-contract-wiring
          path: artifacts/phase3719312
          if-no-files-found: warn
          retention-days: 90
