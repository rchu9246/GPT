name: V14 Operational Paper Trading

on:
  workflow_dispatch:
  schedule:
    # 14:10 Asia/Taipei = 06:10 UTC, Monday-Friday.
    - cron: "10 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: v13-1-paper-trading
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-autotrader-v13.txt

      - name: Run operational paper engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTOTRADER_ACCOUNT: paper-main
        run: python automation/paper_trading_engine_v13_1.py
