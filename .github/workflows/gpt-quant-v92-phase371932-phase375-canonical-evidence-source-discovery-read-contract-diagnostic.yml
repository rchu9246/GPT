name: GPT Quant Phase 3.7.19.3.2 - Phase 3.7.5 Canonical Evidence Source Discovery Read Contract Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: source-discovery-read-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile diagnostic
        run: python -m py_compile automation/v92/phase371932_phase375_canonical_evidence_source_discovery_read_contract_diagnostic.py

      - name: Run read-only source discovery
        run: python automation/v92/phase371932_phase375_canonical_evidence_source_discovery_read_contract_diagnostic.py

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/phase371932/phase371932_source_discovery.md ]; then
            cat artifacts/phase371932/phase371932_source_discovery.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase371932-source-discovery
          path: artifacts/phase371932
          if-no-files-found: warn
          retention-days: 90
