name: Enterprise 4.0 Foundation Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-4-0-foundation
  cancel-in-progress: false

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Enterprise 4.0 Foundation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTOTRADER_ACCOUNT: paper-main
          PYTHONUNBUFFERED: "1"
        run: python automation/enterprise40_foundation.py

      - name: Publish summary
        if: always()
        run: |
          echo "## GPT Quant Enterprise 4.0 Foundation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Portfolio registry validated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Strategy registry validated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run and stage tracking validated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Audit logging validated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Market Regime Foundation refreshed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live trading remains disabled" >> "$GITHUB_STEP_SUMMARY"
