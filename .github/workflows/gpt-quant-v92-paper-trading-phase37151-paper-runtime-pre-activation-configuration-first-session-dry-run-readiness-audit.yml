name: GPT Quant Phase 3.7.15.1 - Paper Runtime Pre-Activation Configuration First Session Dry-Run Readiness Audit

on:
  workflow_dispatch:
  schedule:
    # Weekdays 18:05 UTC / 02:05 Asia-Taipei.
    - cron: "5 18 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: phase37151-paper-runtime-pre-activation-dry-run-audit
  cancel-in-progress: false

jobs:
  paper-runtime-pre-activation-dry-run-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GPT_QUANT_PORTFOLIO_ID: V92_PRODUCTION_PAPER_V91
      GPT_QUANT_STRATEGY_VERSION: V9.1
      WF3715: gpt-quant-v92-paper-trading-phase3715-production-paper-runtime-activation-first-live-paper-session-safety-validation.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Phase 3.7.15.1
        run: python -m py_compile automation/v92/paper_trading_phase37151_paper_runtime_pre_activation_configuration_first_session_dry_run_readiness_audit.py

      - name: Validate Phase 3.7.15.1 dry-run safety contract
        shell: bash
        run: |
          set -euo pipefail
          f="automation/v92/paper_trading_phase37151_paper_runtime_pre_activation_configuration_first_session_dry_run_readiness_audit.py"
          grep -q 'QUALIFICATION_MUTATION_ALLOWED = False' "$f"
          grep -q 'SYNTHETIC_CYCLE_DATE_ALLOWED = False' "$f"
          grep -q 'MANUAL_COUNTER_INCREMENT_ALLOWED = False' "$f"
          grep -q 'DRY_RUN_BROKER_SIDE_EFFECT_ALLOWED = False' "$f"
          grep -q 'DRY_RUN_REAL_MONEY_SIDE_EFFECT_ALLOWED = False' "$f"
          grep -q 'PRE_ACTIVATION_BYPASS_ALLOWED = False' "$f"
          grep -q 'PAPER_RUNTIME_PRE_ACTIVATION_AUDIT_READY_WAITING_FOR_3OF3' "$f"
          grep -q 'PAPER_RUNTIME_PRE_ACTIVATION_AUDIT_READY_FOR_FIRST_SESSION' "$f"
          echo "Phase 3.7.15.1 dry-run safety contract: PASS"

      - name: Confirm Phase 3.7.15 successful lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF3715}/runs?branch=main&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].conclusion // empty')"

          if [ "$result" != "success" ]; then
            echo "::error::No successful Phase 3.7.15 run found on main."
            exit 1
          fi

          echo "Phase 3.7.15 successful lineage: PASS"

      - name: Execute pre-activation configuration and dry-run readiness audit
        id: phase37151
        continue-on-error: true
        run: python automation/v92/paper_trading_phase37151_paper_runtime_pre_activation_configuration_first_session_dry_run_readiness_audit.py

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/phase37151/phase37151_summary.md ]; then
            cat artifacts/phase37151/phase37151_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Phase 3.7.15.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase37151-paper-runtime-pre-activation-dry-run-audit
          path: artifacts/phase37151
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce Phase 3.7.15.1 result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.phase37151.outcome }}" != "success" ]; then
            echo "Phase 3.7.15.1 pre-activation configuration/dry-run audit is BLOCKED."
            exit 1
          fi
          echo "Phase 3.7.15.1 pre-activation configuration/dry-run audit is healthy."
