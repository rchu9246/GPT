name: Enterprise 5.3 Continuous Learning

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-5-3-continuous-learning
  cancel-in-progress: false

jobs:
  continuous-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Enterprise 5.3 Learning and Feedback
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python automation/enterprise53_learning_feedback.py

      - name: Verify Enterprise 5.3 writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: ${{ github.workspace }}/automation
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from enterprise2.client import SupabaseRestClient

          run_date = os.environ.get("QUANT_RUN_DATE", date.today().isoformat())
          client = SupabaseRestClient()

          checks = {
              "learning_cycles_v53": f"cycle_date=eq.{run_date}&limit=1",
              "learning_metrics_v53": f"metric_date=eq.{run_date}&limit=1",
              "learning_status_v53": f"status_date=eq.{run_date}&limit=1",
              "decision_outcomes_v53": f"outcome_date=eq.{run_date}&limit=100",
              "agent_weight_adjustments_v53": f"proposal_date=eq.{run_date}&limit=100",
          }

          results = {}
          for table, query in checks.items():
              rows = client.get(table, query)
              if not rows:
                  raise SystemExit(f"No {table} rows")
              results[table] = len(rows)

          status = client.get(
              "learning_status_v53",
              f"status_date=eq.{run_date}&limit=1",
          )[0]

          print(
              "Enterprise 5.3 verified:",
              "status=", status.get("overall_status"),
              "records=", results,
          )
          PY
