name: GPT Quant V9.2 Paper Trading Phase 2.1 - Live Market Data + Signal Generation

on:
  workflow_dispatch:
    inputs:
      strategy_version:
        description: "V9 or V9.1"
        required: true
        default: "V9.1"
        type: choice
        options: [V9, V9.1]
  schedule:
    # Run before Phase 2 paper execution: 14:15 Asia/Taipei (06:15 UTC)
    - cron: "15 6 * * 1-5"

permissions:
  contents: read

jobs:
  signal-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PAPER_STRATEGY_VERSION: ${{ inputs.strategy_version || 'V9.1' }}
      PAPER_SCORE_THRESHOLD: ${{ vars.PAPER_SCORE_THRESHOLD || '65' }}
      SIGNAL_MIN_HISTORY_ROWS: ${{ vars.SIGNAL_MIN_HISTORY_ROWS || '122' }}
      SIGNAL_MAX_STALE_DAYS: ${{ vars.SIGNAL_MAX_STALE_DAYS || '5' }}
      SIGNAL_TOP_N: ${{ vars.SIGNAL_TOP_N || '30' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Generate Live Market Signals
        run: python automation/v92/paper_trading_phase21_signal_engine.py

      - name: Upload signal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-phase21-signals-${{ github.run_number }}
          path: artifacts/paper_trading_phase21/
          if-no-files-found: warn
          retention-days: 90
