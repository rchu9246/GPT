name: Deploy Paper Trading Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-paper-trading-dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "paper-dashboard-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dashboard config
        env:
          DASHBOARD_SUPABASE_URL: ${{ vars.DASHBOARD_SUPABASE_URL }}
          DASHBOARD_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DASHBOARD_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$DASHBOARD_SUPABASE_URL" || (echo "::error::Missing DASHBOARD_SUPABASE_URL" && exit 1)
          test -n "$DASHBOARD_SUPABASE_PUBLISHABLE_KEY" || (echo "::error::Missing DASHBOARD_SUPABASE_PUBLISHABLE_KEY" && exit 1)
          cat > dashboard/paper_trading_dashboard_config.js <<EOF
          window.GPTQ_PAPER_DASHBOARD = {
            supabaseUrl: "${DASHBOARD_SUPABASE_URL}",
            publishableKey: "${DASHBOARD_SUPABASE_PUBLISHABLE_KEY}"
          };
          EOF

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp dashboard/paper_trading_dashboard.html site/index.html
          cp dashboard/paper_trading_dashboard_config.js site/paper_trading_dashboard_config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
