name: Deploy V10 Forward and Legacy V9 Dashboard

on:
  workflow_run:
    workflows: ['V10 Forward Shadow Paper Validation']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "automation/v10/dashboard_report.py"
      - ".github/workflows/deploy-paper-trading-dashboard.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore and validate V10 dashboard evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=v10-forward-store&per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/forward.zip"
            unzip -q "$RUNNER_TEMP/forward.zip" -d "$RUNNER_TEMP/restored-evidence"
          fi
          python -m automation.v10.restore_forward_store --seed artifacts/v10_forward_store --downloaded "$RUNNER_TEMP/restored-evidence" --output "$RUNNER_TEMP/v10_forward_store"
          python -m automation.v10.dashboard_report --store "$RUNNER_TEMP/v10_forward_store" --output dashboard/v10-forward/report.json
          node --test tests/v10/dashboard_rendering.test.mjs

      - name: Verify V9.2 dashboard
        shell: bash
        run: |
          test -f dashboard/paper_trading_dashboard.html
          grep -q "GPT Quant V9.2 Paper Trading Dashboard" dashboard/paper_trading_dashboard.html

      - name: Create dashboard config
        env:
          DASHBOARD_SUPABASE_URL: ${{ vars.DASHBOARD_SUPABASE_URL }}
          DASHBOARD_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DASHBOARD_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          test -n "$DASHBOARD_SUPABASE_URL" || (echo "::error::Missing repository variable DASHBOARD_SUPABASE_URL" && exit 1)
          test -n "$DASHBOARD_SUPABASE_PUBLISHABLE_KEY" || (echo "::error::Missing repository variable DASHBOARD_SUPABASE_PUBLISHABLE_KEY" && exit 1)
          cat > dashboard/paper_trading_dashboard_config.js <<EOF2
          window.GPTQ_PAPER_DASHBOARD = {
            supabaseUrl: "${DASHBOARD_SUPABASE_URL}",
            publishableKey: "${DASHBOARD_SUPABASE_PUBLISHABLE_KEY}"
          };
          EOF2

      - name: Prepare Pages site
        shell: bash
        run: |
          rm -rf site
          mkdir -p site
          cp -a dashboard/v10-forward site/v10-forward
          cp dashboard/index.html site/index.html
          mkdir -p site/legacy-v9
          cp dashboard/paper_trading_dashboard.html site/legacy-v9/index.html
          cp dashboard/paper_trading_dashboard_config.js site/legacy-v9/paper_trading_dashboard_config.js
          cp dashboard/paper_trading_dashboard_config.js site/paper_trading_dashboard_config.js
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy V10 Forward and Legacy V9 dashboard
        id: deployment
        uses: actions/deploy-pages@v4
