name: GPT Quant Phase 3.7.7 - Production Paper Qualification Evidence Persistence Cross-Run Accumulation

on:
  workflow_dispatch:
  schedule:
    # Taiwan 22:42 = UTC 14:42, after Phase 3.7.4 daily monitoring and before Phase 3.7.5.
    - cron: "42 14 * * 1-5"

permissions:
  contents: read
  actions: read

jobs:
  evidence-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GPT_QUANT_PORTFOLIO_ID: V92_PRODUCTION_PAPER_V91
      GPT_QUANT_STRATEGY_VERSION: V9.1
      PHASE374_RESULT_PATH: artifacts/phase377/input/phase374_result.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Phase 3.7.7
        run: python -m py_compile automation/v92/paper_trading_phase377_production_paper_qualification_evidence_persistence_cross_run_accumulation.py

      - name: Validate evidence persistence safety contract
        shell: bash
        run: |
          set -euo pipefail
          f="automation/v92/paper_trading_phase377_production_paper_qualification_evidence_persistence_cross_run_accumulation.py"
          grep -q 'BROKER_ORDER_SUBMISSION_ENABLED = False' "$f"
          grep -q 'REAL_MONEY_TRADING_ENABLED = False' "$f"
          grep -q 'HISTORICAL_REWRITE_ALLOWED = False' "$f"
          grep -q 'EVIDENCE_PERSISTENCE_OPERATIONAL' "$f"
          grep -q 'EVIDENCE_PERSISTENCE_BLOCKED' "$f"
          echo "Phase 3.7.7 safety contract: PASS"

      - name: Resolve latest Phase 3.7.4 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase377/input /tmp/phase374
          workflow="gpt-quant-v92-paper-trading-phase374-production-paper-daily-cycle-monitoring-evidence-accumulation.yml"

          run_id="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&status=success&per_page=20" \
            --jq '.workflow_runs[0].id // empty' || true)"

          if [ -z "$run_id" ]; then
            echo "No successful Phase 3.7.4 run found; persistence will remain WAITING."
            exit 0
          fi

          artifact_id="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            --jq '.artifacts[] | select(.name=="phase374-production-paper-daily-cycle-monitoring-evidence") | .id' \
            | head -n 1 || true)"

          if [ -z "$artifact_id" ]; then
            echo "No Phase 3.7.4 evidence artifact found; persistence will remain WAITING."
            exit 0
          fi

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > /tmp/phase374/evidence.zip

          unzip -o /tmp/phase374/evidence.zip -d /tmp/phase374/unpacked >/dev/null

          result="$(find /tmp/phase374/unpacked -type f -name 'phase374_result.json' | head -n 1 || true)"
          if [ -n "$result" ]; then
            cp "$result" artifacts/phase377/input/phase374_result.json
            echo "Resolved Phase 3.7.4 evidence from run ${run_id}."
          else
            echo "phase374_result.json not found; persistence will remain WAITING."
          fi

      - name: Execute Phase 3.7.7
        id: phase377
        continue-on-error: true
        run: python automation/v92/paper_trading_phase377_production_paper_qualification_evidence_persistence_cross_run_accumulation.py

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/phase377/phase377_summary.md ]; then
            cat artifacts/phase377/phase377_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase377-production-paper-qualification-evidence-persistence
          path: artifacts/phase377
          if-no-files-found: warn
          retention-days: 120

      - name: Enforce persistence safety result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.phase377.outcome }}" != "success" ]; then
            echo "Phase 3.7.7 evidence persistence is BLOCKED."
            exit 1
          fi
          echo "Phase 3.7.7 evidence persistence is healthy."
