name: Enterprise 5.6 Evolution Intelligence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-5-6-evolution-intelligence
  cancel-in-progress: false

jobs:
  evolution-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Enterprise 5.6 Evolution Intelligence v1.1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENTERPRISE56_MONTE_CARLO_ITERATIONS: "250"
          ENTERPRISE56_SELECTION_THRESHOLD: "70"
          ENTERPRISE56_MAX_CANDIDATES: "20"
        run: |
          python automation/enterprise56_evolution_intelligence.py

      - name: Verify Enterprise 5.6 writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: ${{ github.workspace }}/automation
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from enterprise2.client import SupabaseRestClient

          run_date = os.environ.get("QUANT_RUN_DATE", date.today().isoformat())
          client = SupabaseRestClient()

          status_rows = client.get(
              "evolution_status_v56",
              f"status_date=eq.{run_date}&limit=1",
          )
          if not status_rows:
              raise SystemExit("No evolution_status_v56 row found")

          metrics_rows = client.get(
              "evolution_metrics_v56",
              f"metric_date=eq.{run_date}&limit=1",
          )
          if not metrics_rows:
              raise SystemExit("No evolution_metrics_v56 row found")

          requests = client.get(
              "promotion_requests_v55",
              "limit=1",
          )
          versions = client.get(
              "portfolio_versions_v56",
              f"version_date=eq.{run_date}&version_type=eq.CANDIDATE&limit=500",
          )
          runs = client.get(
              "simulation_runs_v56",
              f"run_date=eq.{run_date}&limit=500",
          )
          scores = client.get(
              "evolution_scores_v56",
              f"score_date=eq.{run_date}&limit=500",
          )
          rankings = client.get(
              "portfolio_rankings_v56",
              f"ranking_date=eq.{run_date}&limit=500",
          )

          if requests and not versions:
              raise SystemExit(
                  "v55 requests exist but v56 created zero candidate versions"
              )
          if versions and (
              not runs
              or not scores
              or not rankings
          ):
              raise SystemExit(
                  "v56 candidates exist but downstream evolution rows are missing"
              )

          status = status_rows[0]
          print(
              "Enterprise 5.6 verified:",
              "status=", status.get("overall_status"),
              "versions=", len(versions),
              "runs=", len(runs),
              "scores=", len(scores),
              "rankings=", len(rankings),
              "top_candidate=", status.get("current_top_candidate_version"),
              "live_trading=", status.get("live_trading_enabled"),
          )
          PY
