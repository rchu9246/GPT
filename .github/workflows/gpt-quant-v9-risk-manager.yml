name: GPT Quant V9 Risk Manager

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum sizing rows to process"
        required: true
        default: "100"
        type: string
      max_single_position:
        description: "Maximum single position"
        required: true
        default: "0.10"
        type: string
      max_total_exposure:
        description: "Maximum total exposure"
        required: true
        default: "0.60"
        type: string
      max_open_positions:
        description: "Maximum simultaneous positions"
        required: true
        default: "10"
        type: string
      daily_loss_limit:
        description: "Daily loss limit"
        required: true
        default: "0.02"
        type: string
      portfolio_drawdown_limit:
        description: "Portfolio drawdown limit"
        required: true
        default: "0.10"
        type: string
      max_var_per_position:
        description: "Maximum VaR per position"
        required: true
        default: "0.02"
        type: string

permissions:
  contents: read

jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run GPT Quant V9 Risk Manager
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python automation/gpt_quant_v9_risk_manager.py \
            --limit "${{ inputs.limit }}" \
            --max-single-position "${{ inputs.max_single_position }}" \
            --max-total-exposure "${{ inputs.max_total_exposure }}" \
            --max-open-positions "${{ inputs.max_open_positions }}" \
            --daily-loss-limit "${{ inputs.daily_loss_limit }}" \
            --portfolio-drawdown-limit "${{ inputs.portfolio_drawdown_limit }}" \
            --max-var-per-position "${{ inputs.max_var_per_position }}"
      - name: Verify Risk Manager Writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: ${{ github.workspace }}/automation
        run: |
          python - <<'PY'
          from enterprise2.client import SupabaseRestClient
          c = SupabaseRestClient()
          d = c.get("gpt_quant_v9_risk_decisions", "order=risk_date.desc,rank_no.asc&limit=100")
          s = c.get("gpt_quant_v9_risk_summaries", "order=risk_date.desc&limit=1")
          if not d or not s:
              raise SystemExit("Risk Manager writes missing")
          for row in d:
              approved = float(row.get("approved_position_size") or 0)
              if not 0 <= approved <= 0.25:
                  raise SystemExit(f"Invalid approved position: {approved}")
              if row.get("paper_only") is not True or row.get("live_trading_enabled") is not False:
                  raise SystemExit("Risk safety violation")
          print("Risk Manager verified:", len(d), s[0].get("approved_total_exposure"), s[0].get("kill_switch_active"))
          PY
