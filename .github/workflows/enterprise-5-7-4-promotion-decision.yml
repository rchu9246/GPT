name: Enterprise 5.7.4 Promotion Decision Engine

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: "promotion_candidates_v57 Candidate UUID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: enterprise-5-7-4-decision-${{ inputs.candidate_id }}
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Enterprise 5.7.4 Decision Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python automation/enterprise574_promotion_decision_engine.py             --candidate-id "${{ inputs.candidate_id }}"

      - name: Verify Enterprise 5.7.4 Writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: ${{ github.workspace }}/automation
        run: |
          python - <<'PY'
          from enterprise2.client import SupabaseRestClient

          candidate_id = "${{ inputs.candidate_id }}"
          client = SupabaseRestClient()

          audits = client.get(
              "promotion_audit_v57",
              (
                  "event_type=eq.FINAL_PROMOTION_DECISION"
                  f"&candidate_id=eq.{candidate_id}"
                  "&order=audit_time.desc"
                  "&limit=1"
              ),
          )
          if not audits:
              raise SystemExit("Final promotion decision audit not found")

          candidate_rows = client.get(
              "promotion_candidates_v57",
              f"id=eq.{candidate_id}&limit=1",
          )
          if not candidate_rows:
              raise SystemExit("Candidate not found after decision")

          status_rows = client.get(
              "promotion_status_v57",
              "order=status_date.desc&limit=1",
          )
          if not status_rows:
              raise SystemExit("promotion_status_v57 not found")

          status = status_rows[0]
          if status.get("live_trading_enabled") is not False:
              raise SystemExit("Safety violation: live trading enabled")
          if status.get("broker_submission_enabled") is not False:
              raise SystemExit("Safety violation: broker submission enabled")

          print(
              "Enterprise 5.7.4 verified:",
              "decision=", audits[0].get("new_state", {}).get("final_decision"),
              "candidate_status=", candidate_rows[0].get("candidate_status"),
              "live_trading=", status.get("live_trading_enabled"),
          )
          PY
