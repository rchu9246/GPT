name: GPT Quant Phase 3.7.15 - Production Paper Runtime Activation First Live Paper Session Safety Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "50 17 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: phase3715-first-live-paper-session-safety-validation
  cancel-in-progress: false

jobs:
  first-live-paper-session-safety-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GPT_QUANT_PORTFOLIO_ID: V92_PRODUCTION_PAPER_V91
      GPT_QUANT_STRATEGY_VERSION: V9.1
      WF3714: gpt-quant-v92-paper-trading-phase3714-production-paper-qualification-3of3-promotion-finalization-paper-runtime-activation-gate.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Phase 3.7.15
        run: python -m py_compile automation/v92/paper_trading_phase3715_production_paper_runtime_activation_first_live_paper_session_safety_validation.py

      - name: Validate Phase 3.7.15 safety contract
        shell: bash
        run: |
          set -euo pipefail
          f="automation/v92/paper_trading_phase3715_production_paper_runtime_activation_first_live_paper_session_safety_validation.py"
          grep -q 'SYNTHETIC_QUALIFICATION_ALLOWED = False' "$f"
          grep -q 'MANUAL_COUNTER_INCREMENT_ALLOWED = False' "$f"
          grep -q 'RUNTIME_ACTIVATION_WITHOUT_GATE_READY_ALLOWED = False' "$f"
          grep -q 'FIRST_LIVE_PAPER_SESSION_WITHOUT_SAFETY_PASS_ALLOWED = False' "$f"
          grep -q 'PAPER_RUNTIME_ACTIVATION_ARMED_WAITING' "$f"
          grep -q 'PAPER_RUNTIME_ACTIVATION_VALIDATED' "$f"

      - name: Confirm Phase 3.7.14 successful lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF3714}/runs?branch=main&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].conclusion // empty')"
          [ "$result" = "success" ] || { echo "::error::No successful Phase 3.7.14 run found."; exit 1; }

      - name: Evaluate runtime activation and first live paper session safety
        id: phase3715
        continue-on-error: true
        run: python automation/v92/paper_trading_phase3715_production_paper_runtime_activation_first_live_paper_session_safety_validation.py

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/phase3715/phase3715_summary.md ]; then
            cat artifacts/phase3715/phase3715_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Phase 3.7.15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3715-first-live-paper-session-safety-validation
          path: artifacts/phase3715
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce Phase 3.7.15 result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.phase3715.outcome }}" != "success" ]; then
            echo "Phase 3.7.15 first live paper session safety validation is BLOCKED."
            exit 1
          fi
          echo "Phase 3.7.15 first live paper session safety validation is healthy."
