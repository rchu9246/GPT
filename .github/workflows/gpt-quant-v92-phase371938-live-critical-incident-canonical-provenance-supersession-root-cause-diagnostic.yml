name: GPT Quant Phase 3.7.19.3.8 - Live Critical Incident Canonical Provenance Supersession Root Cause Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: live-critical-incident-root-cause
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile diagnostic
        run: python -m py_compile automation/v92/phase371938_phase375_live_critical_incident_canonical_provenance_supersession_root_cause_diagnostic.py

      - name: Run read-only root cause diagnostic
        run: python automation/v92/phase371938_phase375_live_critical_incident_canonical_provenance_supersession_root_cause_diagnostic.py

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/phase371938/phase371938_live_critical_incident_root_cause.md ]; then
            cat artifacts/phase371938/phase371938_live_critical_incident_root_cause.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase371938-live-critical-incident-root-cause
          path: artifacts/phase371938
          if-no-files-found: warn
          retention-days: 90
