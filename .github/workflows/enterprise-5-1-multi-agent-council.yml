name: Enterprise 5.1 Multi-Agent Decision Council

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-5-1-multi-agent-council
  cancel-in-progress: false

jobs:
  decision-council:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Enterprise 5.1 Multi-Agent Council
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python automation/enterprise51_multi_agent_council.py

      - name: Verify Enterprise 5.1 Council
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: ${{ github.workspace }}/automation
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from enterprise2.client import SupabaseRestClient

          run_date = os.environ.get("QUANT_RUN_DATE", date.today().isoformat())
          client = SupabaseRestClient()

          sessions = client.get(
              "council_sessions_v51",
              f"session_date=eq.{run_date}&limit=1",
          )
          if not sessions:
              raise SystemExit("No council session")

          session_id = sessions[0]["id"]
          checks = {
              "agent_votes_v51": f"session_id=eq.{session_id}&limit=100",
              "agent_explanations_v51": f"session_id=eq.{session_id}&limit=100",
              "decision_council_v51": f"session_id=eq.{session_id}&limit=1",
              "consensus_history_v51": f"session_id=eq.{session_id}&limit=1",
              "council_status_v51": f"status_date=eq.{run_date}&limit=1",
          }

          results = {}
          for table, query in checks.items():
              rows = client.get(table, query)
              if not rows:
                  raise SystemExit(f"No {table} rows")
              results[table] = len(rows)

          print(
              "Enterprise 5.1 verified:",
              "session_id=", session_id,
              "status=", sessions[0].get("session_status"),
              "records=", results,
          )
          PY
