name: Enterprise 5.7.3 Promotion Calibration Engine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Calibration mode"
        required: true
        type: choice
        default: ANALYZE_ONLY
        options:
          - ANALYZE_ONLY
          - APPLY_PAPER_PILOT
      limit:
        description: "Maximum candidates to analyze"
        required: true
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: enterprise-5-7-3-promotion-calibration
  cancel-in-progress: false

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Enterprise 5.7.3 Calibration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python automation/enterprise573_promotion_calibration_engine.py             --mode "${{ inputs.mode }}"             --limit "${{ inputs.limit }}"

      - name: Verify Enterprise 5.7.3 Writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: ${{ github.workspace }}/automation
        run: |
          python - <<'PY'
          from enterprise2.client import SupabaseRestClient

          client = SupabaseRestClient()

          audits = client.get(
              "promotion_audit_v57",
              "event_type=eq.PROMOTION_CALIBRATION&order=audit_time.desc&limit=1",
          )
          if not audits:
              raise SystemExit("Calibration audit not found")

          status_rows = client.get(
              "promotion_status_v57",
              "order=status_date.desc&limit=1",
          )
          if not status_rows:
              raise SystemExit("promotion_status_v57 not found")

          status = status_rows[0]
          if status.get("live_trading_enabled") is not False:
              raise SystemExit("Safety violation: live trading enabled")

          print(
              "Enterprise 5.7.3 verified:",
              "audit_status=", audits[0].get("event_status"),
              "promotion_status=", status.get("overall_status"),
              "live_trading=", status.get("live_trading_enabled"),
          )
          PY
