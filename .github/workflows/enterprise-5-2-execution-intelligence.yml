name: Enterprise 5.2 Execution Intelligence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-5-2-execution-intelligence
  cancel-in-progress: false

jobs:
  execution-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Enterprise 5.2 Execution Intelligence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python automation/enterprise52_execution_layer.py

      - name: Verify Enterprise 5.2 writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: ${{ github.workspace }}/automation
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from enterprise2.client import SupabaseRestClient

          run_date = os.environ.get("QUANT_RUN_DATE", date.today().isoformat())
          client = SupabaseRestClient()

          plans = client.get(
              "execution_plans_v52",
              f"plan_date=eq.{run_date}&limit=100",
          )
          if not plans:
              raise SystemExit("No execution_plans_v52 rows")

          status = client.get(
              "execution_status_v52",
              f"status_date=eq.{run_date}&limit=1",
          )
          if not status:
              raise SystemExit("No execution_status_v52 row")

          plan_ids = [row["id"] for row in plans]
          orders = client.get(
              "execution_orders_v52",
              f"plan_id=in.({','.join(plan_ids)})&limit=1000",
          )
          checks = client.get(
              "execution_risk_checks_v52",
              f"plan_id=in.({','.join(plan_ids)})&limit=1000",
          )

          print(
              "Enterprise 5.2 verified:",
              "plans=", len(plans),
              "orders=", len(orders),
              "risk_checks=", len(checks),
              "status=", status[0].get("overall_status"),
          )
          PY
