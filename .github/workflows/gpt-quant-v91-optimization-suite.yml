name: GPT Quant V9.1 Optimization Suite
on:
  workflow_dispatch:
    inputs:
      limit: {description: "Maximum rankings", required: true, default: "100", type: string}
      starting_equity: {description: "Paper equity", required: true, default: "1000000", type: string}
      base_risk_budget: {description: "Base risk budget", required: true, default: "0.60", type: string}
      max_positions: {description: "Maximum positions", required: true, default: "10", type: string}
      max_single_weight: {description: "Maximum single weight", required: true, default: "0.10", type: string}
permissions: {contents: read}
concurrency:
  group: gpt-quant-v91-optimization-suite
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Confidence Calibration
        env: {SUPABASE_URL: "${{ secrets.SUPABASE_URL }}", SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"}
        run: python automation/gpt_quant_v91_confidence_calibration.py --limit "${{ inputs.limit }}"
      - name: Adaptive Risk
        env: {SUPABASE_URL: "${{ secrets.SUPABASE_URL }}", SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"}
        run: python automation/gpt_quant_v91_adaptive_risk_manager.py --base-risk-budget "${{ inputs.base_risk_budget }}"
      - name: Portfolio Optimizer
        env: {SUPABASE_URL: "${{ secrets.SUPABASE_URL }}", SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"}
        run: python automation/gpt_quant_v91_portfolio_optimizer.py --max-positions "${{ inputs.max_positions }}" --max-single-weight "${{ inputs.max_single_weight }}"
      - name: Paper Trading
        env: {SUPABASE_URL: "${{ secrets.SUPABASE_URL }}", SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"}
        run: python automation/gpt_quant_v91_paper_trading_engine.py --starting-equity "${{ inputs.starting_equity }}"
