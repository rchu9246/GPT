name: Enterprise 3.0 Stable Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - "src/**"
      - "package.json"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall automation

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: Type check
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Run diagnostics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python automation/enterprise3_diagnostics.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise3-diagnostics
          path: enterprise3-diagnostics.json
          if-no-files-found: warn

      - name: Publish summary
        if: always()
        run: |
          echo "## GPT Quant Enterprise 3.0.3 Stable" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python compile: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend type check: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend build: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Supabase diagnostics: see artifact" >> "$GITHUB_STEP_SUMMARY"
