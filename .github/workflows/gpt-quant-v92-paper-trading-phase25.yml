name: GPT Quant V9.2 Paper Trading Phase 2.5 - Automatic Trading Orchestrator

on:
  workflow_dispatch:
    inputs:
      strategy_version:
        description: "V9 or V9.1"
        required: true
        default: "V9.1"
        type: choice
        options: [V9, V9.1]

  schedule:
    # 14:30 Asia/Taipei = 06:30 UTC, Monday-Friday
    - cron: "30 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: gpt-quant-v92-paper-trading-phase25
  cancel-in-progress: false

jobs:
  automatic-trading-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      PAPER_STRATEGY_VERSION: ${{ inputs.strategy_version || 'V9.1' }}
      PAPER_TRADING_MODE: SHADOW_ONLY_NO_BROKER

      PAPER_SCORE_THRESHOLD: ${{ vars.PAPER_SCORE_THRESHOLD || '65' }}
      PAPER_INITIAL_CAPITAL: ${{ vars.PAPER_INITIAL_CAPITAL || '1000000' }}

      PAPER_POSITION_SIZE: ${{ vars.PAPER_POSITION_SIZE || '0.10' }}
      PAPER_MAX_SINGLE_POSITION: ${{ vars.PAPER_MAX_SINGLE_POSITION || '0.15' }}
      PAPER_MAX_GROSS_EXPOSURE: ${{ vars.PAPER_MAX_GROSS_EXPOSURE || '0.80' }}
      PAPER_MAX_OPEN_POSITIONS: ${{ vars.PAPER_MAX_OPEN_POSITIONS || '10' }}
      PAPER_MAX_NEW_ORDERS: ${{ vars.PAPER_MAX_NEW_ORDERS || '5' }}

      PAPER_STOP_LOSS: ${{ vars.PAPER_STOP_LOSS || '0.05' }}
      PAPER_TAKE_PROFIT: ${{ vars.PAPER_TAKE_PROFIT || '0.10' }}
      PAPER_TRAILING_STOP: ${{ vars.PAPER_TRAILING_STOP || '0.06' }}
      PAPER_MAX_HOLDING_DAYS: ${{ vars.PAPER_MAX_HOLDING_DAYS || '10' }}
      PAPER_EXIT_SIGNAL_THRESHOLD: ${{ vars.PAPER_EXIT_SIGNAL_THRESHOLD || '50' }}

      PAPER_SLIPPAGE_RATE: ${{ vars.PAPER_SLIPPAGE_RATE || '0.001' }}
      PAPER_SELL_SLIPPAGE_RATE: ${{ vars.PAPER_SELL_SLIPPAGE_RATE || '0.001' }}
      PAPER_COMMISSION_RATE: ${{ vars.PAPER_COMMISSION_RATE || '0.001425' }}
      PAPER_TRANSACTION_TAX_RATE: ${{ vars.PAPER_TRANSACTION_TAX_RATE || '0.003' }}

      MARKET_DATA_PROVIDER: finmind
      MARKET_DATA_LOOKBACK_DAYS: ${{ vars.MARKET_DATA_LOOKBACK_DAYS || '45' }}
      MARKET_DATA_MAX_BACKFILL_DAYS: ${{ vars.MARKET_DATA_MAX_BACKFILL_DAYS || '120' }}
      MARKET_DATA_REQUEST_SLEEP_SECONDS: ${{ vars.MARKET_DATA_REQUEST_SLEEP_SECONDS || '0.35' }}

      PHASE25_FAIL_CLOSED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # FIX: Phase 2.2 imports requests.
      # Phase 2.5 must install the dependency before calling child phases.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install requests

      - name: Validate secrets and Phase 2.5 files
        shell: bash
        run: |
          set -euo pipefail

          test -n "${SUPABASE_URL:-}" || {
            echo "::error::Missing SUPABASE_URL"
            exit 1
          }

          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || {
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          }

          test -n "${FINMIND_TOKEN:-}" || {
            echo "::error::Missing FINMIND_TOKEN"
            exit 1
          }

          test -f automation/v92/paper_trading_phase25_orchestrator.py || {
            echo "::error::Missing Phase 2.5 orchestrator"
            exit 1
          }

          test -f automation/v92/paper_trading_phase22_market_ingestion.py || {
            echo "::error::Missing Phase 2.2 script"
            exit 1
          }

          test -f automation/v92/paper_trading_phase21_signal_engine.py || {
            echo "::error::Missing Phase 2.1 script"
            exit 1
          }

          test -f automation/v92/paper_trading_phase23_signal_execution.py || {
            echo "::error::Missing Phase 2.3 script"
            exit 1
          }

          test -f automation/v92/paper_trading_phase24_position_management.py || {
            echo "::error::Missing Phase 2.4 script"
            exit 1
          }

          python - <<'PY'
          import requests
          print("requests dependency: OK")
          PY

      - name: Run Automatic Trading Orchestrator
        run: |
          python automation/v92/paper_trading_phase25_orchestrator.py

      - name: Publish Phase 2.5 summary
        if: always()
        shell: bash
        run: |
          if [ -f phase25_summary.md ]; then
            cat phase25_summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# GPT Quant V9.2 Paper Trading Phase 2.5" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Orchestrator did not produce phase25_summary.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Phase 2.5 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase25-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 90
          path: |
            phase25_summary.md
            phase25_result.json
            phase25_logs/
