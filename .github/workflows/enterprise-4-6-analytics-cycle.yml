name: Enterprise 4.6 Analytics Cycle
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enterprise-4-6-analytics-cycle
  cancel-in-progress: false
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Enterprise 4.6 Analytics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python automation/enterprise46_performance_analytics.py
          python automation/enterprise46_market_intelligence.py
          python automation/enterprise46_strategy_analytics.py
          python automation/enterprise46_portfolio_health.py
          python automation/enterprise46_market_replay.py
          python automation/enterprise46_dashboard_snapshot.py
