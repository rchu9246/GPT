name: V13 Paper AutoTrader

on:
  workflow_dispatch:
  schedule:
    - cron: "5 1 * * 1-5"

permissions:
  contents: read

jobs:
  paper-trader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-autotrader-v13.txt
      - name: Generate paper orders only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTOTRADER_ACCOUNT: paper-main
        run: python automation/paper_autotrader_v13.py
