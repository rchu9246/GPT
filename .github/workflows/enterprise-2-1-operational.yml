name: Enterprise 2.1 Operational Daily Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "50 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: enterprise-2-1-operational
  cancel-in-progress: false

jobs:
  operational:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-autotrader-v13.txt

      - name: Run legacy production stack
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTOTRADER_ACCOUNT: paper-main
        run: |
          python automation/generate_orders_v16.py
          python automation/portfolio_os_v17.py
          python automation/ai_fund_manager_v18.py
          python automation/hedge_fund_manager_v19.py
          python automation/institutional_report_v20.py
          python automation/multi_agent_council_v21.py
          python automation/trading_director_v22.py

      - name: Consolidate Enterprise 2.0 core
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTOTRADER_ACCOUNT: paper-main
        run: python automation/enterprise2_master.py

      - name: Generate Enterprise 2.1 operations, risk and brief
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTOTRADER_ACCOUNT: paper-main
        run: python automation/enterprise2_operational.py
