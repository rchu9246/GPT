name: Enterprise 3.0 Stable Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - ".github/workflows/**"
      - "requirements.txt"
      - "package.json"
      - "src/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall automation

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
