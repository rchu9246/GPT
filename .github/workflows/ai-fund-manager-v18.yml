name: V18 AI Fund Manager

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: v18-ai-fund-manager
  cancel-in-progress: false

jobs:
  fund-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run V18 AI investment committee
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTOTRADER_ACCOUNT: paper-main
        run: python automation/ai_fund_manager_v18.py
