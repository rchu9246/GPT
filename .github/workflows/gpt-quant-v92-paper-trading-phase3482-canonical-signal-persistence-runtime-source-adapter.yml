name: GPT Quant Phase 3.4.8.2 - Canonical Signal Persistence Runtime Source Adapter

on:
  workflow_dispatch:
    inputs:
      strategy_version:
        description: Strategy version
        required: true
        default: V9.1
        type: string

      approver:
        description: Human approver/operator ID for same-run gate reconstruction
        required: true
        default: rchu9246
        type: string

      score_threshold:
        description: Minimum canonical signal score
        required: true
        default: "65"
        type: string

      max_candidates:
        description: Maximum canonical signals per runtime batch
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: gpt-quant-phase3482-canonical-persistence-runtime-adapter
  cancel-in-progress: false

jobs:
  canonical-persistence-runtime-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      PAPER_STRATEGY_VERSION: ${{ inputs.strategy_version || 'V9.1' }}
      STRATEGY_VERSION: ${{ inputs.strategy_version || 'V9.1' }}
      PAPER_TRADING_MODE: SHADOW_ONLY_NO_BROKER

      PHASE3421_REQUIRED_PASS_DAYS: "5"
      PHASE344_REQUIRED_PASS_DAYS: "5"
      PHASE345_REQUIRED_PASS_DAYS: "5"
      PHASE346_REQUIRED_PASS_DAYS: "5"

      PHASE3482_SCORE_THRESHOLD: ${{ inputs.score_threshold || '65' }}
      PHASE3482_MAX_CANDIDATES: ${{ inputs.max_candidates || '3' }}

      PHASE348_SCORE_THRESHOLD: ${{ inputs.score_threshold || '65' }}
      PHASE348_MAX_CANDIDATES: ${{ inputs.max_candidates || '3' }}
      PHASE348_INITIAL_CASH: "1000000"
      PHASE348_MAX_POSITION_PCT: "0.20"
      PHASE348_ROUND_LOT: "1000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install --upgrade pip requests

      - name: Validate Phase 3.4.8.2 safety contract
        shell: bash
        run: |
          set -euo pipefail

          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"

          test -f automation/v92/paper_trading_phase3482_canonical_signal_persistence_runtime_source_adapter.py
          test -f automation/v92/paper_trading_phase348_canonical_market_signal_to_paper_execution_bridge.py
          test -f supabase/PHASE3482_CANONICAL_RUNTIME_STORE.sql

          grep -q 'PERSISTED_REAL_EVIDENCE_ONLY_ZERO_SYNTHETIC_ZERO_BROKER_ZERO_REAL_MONEY' \
            automation/v92/paper_trading_phase3482_canonical_signal_persistence_runtime_source_adapter.py

          grep -q '"synthetic_fallback_allowed": False' \
            automation/v92/paper_trading_phase3482_canonical_signal_persistence_runtime_source_adapter.py

          grep -q '"broker_order_submission_enabled": False' \
            automation/v92/paper_trading_phase3482_canonical_signal_persistence_runtime_source_adapter.py

          grep -q '"real_money_trading_enabled": False' \
            automation/v92/paper_trading_phase3482_canonical_signal_persistence_runtime_source_adapter.py

          echo "Phase 3.4.8.2 safety contract: PASS"

      - name: Execute Phase 3.4.8.2 canonical persistence adapter
        shell: bash
        run: |
          set -euo pipefail

          python automation/v92/paper_trading_phase3482_canonical_signal_persistence_runtime_source_adapter.py \
            --approver "${{ inputs.approver }}"

      - name: Validate Phase 3.4.8.2 output
        shell: bash
        run: |
          set -euo pipefail

          test -f phase3482_output/phase3482_runtime_adapter.json
          test -f phase3482_output/canonical_signals.persisted.json
          test -f phase3482_output/canonical_market_prices.persisted.json
          test -f phase348_output/phase348_execution.json

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("phase3482_output/phase3482_runtime_adapter.json").read_text(
                  encoding="utf-8"
              )
          )

          p348 = json.loads(
              Path("phase348_output/phase348_execution.json").read_text(
                  encoding="utf-8"
              )
          )

          assert data["version"] == "3.4.8.2", data
          assert data["status"] == "PASS", data
          assert data["runtime_execution_gate"] == "OPEN", data
          assert data["canonical_batch_id"], data

          assert data["runtime_signal_source"] == "supabase:paper_canonical_signals_v92", data
          assert data["runtime_market_source"] == "supabase:paper_canonical_market_prices_v92", data

          assert data["synthetic_fallback_allowed"] is False, data
          assert data["synthetic_evidence_present"] is False, data
          assert data["broker_api_used"] is False, data
          assert data["broker_credentials_used"] is False, data
          assert data["broker_order_submission_enabled"] is False, data
          assert data["real_money_trading_enabled"] is False, data
          assert data["live_money_release_authorized"] is False, data
          assert data["fail_closed_policy"] is True, data
          assert data["fail_closed_triggered"] is False, data

          assert p348["synthetic_fallback_allowed"] is False, p348
          assert p348["synthetic_evidence_present"] is False, p348

          if data["paper_orders_created"] > 0:
              assert data["signals_persisted"] > 0, data
              assert data["market_prices_persisted"] > 0, data
              assert data["phase348_execution_state"] == "REAL_CANONICAL_EVIDENCE_EXECUTED", data
              assert data["simulated_fills"] == data["paper_orders_created"], data
          else:
              assert data["phase348_execution_state"] in {
                  "NO_CANONICAL_SIGNAL_ZERO_ORDERS",
                  "NO_REAL_MARKET_PRICE_ZERO_ORDERS",
                  "REAL_EVIDENCE_BUT_ZERO_SIZED_ORDERS",
              }, data

          print("Phase 3.4.8.2 output validation: PASS")
          PY

      - name: Upload Phase 3.4.8.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3482-canonical-persistence-${{ github.run_id }}
          path: |
            phase3421_output/
            phase342_output/
            phase3442_output/
            phase344_output/
            phase345_output/
            phase3451_output/
            phase346_output/
            phase348_output/
            phase3482_output/
          if-no-files-found: warn
          retention-days: 90
