name: Enterprise 4.5 Learning Cycle

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: enterprise-4-5-learning-cycle
  cancel-in-progress: false

jobs:
  learning-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enterprise 4.4 Operational Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python automation/enterprise40_foundation.py
          python automation/enterprise41_risk_governor.py
          python automation/enterprise42_adaptive_allocation.py
          python automation/enterprise43_investment_committee.py
          python automation/enterprise44_portfolio_brain.py

      - name: Capture Decision Memory
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENTERPRISE45_OUTCOME_DAYS: "1"
        run: python automation/enterprise45_decision_memory.py

      - name: Evaluate Learning Outcomes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENTERPRISE45_WIN_THRESHOLD: "0.25"
          ENTERPRISE45_LOSS_THRESHOLD: "-0.25"
        run: python automation/enterprise45_learning_engine.py

      - name: Update Strategy Ratings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python automation/enterprise45_strategy_rating.py
