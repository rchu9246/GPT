name: Enterprise 4.7.1 Strategy Scoring

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-4-7-1-strategy-scoring
  cancel-in-progress: false

jobs:
  strategy-scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Strategy Scoring Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python automation/enterprise47_strategy_scoring.py

      - name: Verify Strategy Scores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: ${{ github.workspace }}/automation
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from enterprise2.client import SupabaseRestClient

          run_date = os.environ.get(
              "QUANT_RUN_DATE",
              date.today().isoformat(),
          )
          client = SupabaseRestClient()

          scores = client.get(
              "strategy_scores_v47",
              (
                  f"score_date=eq.{run_date}"
                  "&order=portfolio_id.asc,rank.asc"
                  "&limit=1000"
              ),
          )
          if not scores:
              raise SystemExit(
                  f"No strategy_scores_v47 rows for {run_date}"
              )

          statuses = client.get(
              "strategy_engine_status_v47",
              f"status_date=eq.{run_date}&limit=1",
          )
          if not statuses:
              raise SystemExit(
                  f"No strategy_engine_status_v47 row for {run_date}"
              )

          eligible = [row for row in scores if row.get("eligible")]
          top = eligible[0] if eligible else scores[0]

          print(
              "Strategy scoring verified:",
              "rows=", len(scores),
              "top=", top.get("strategy_key"),
              "score=", top.get("composite_score"),
              "status=", statuses[0].get("overall_status"),
          )
          PY
