name: GPT Quant V9.2 Paper Trading Phase 2.2 - Automatic Market Data Ingestion

on:
  workflow_dispatch:
  schedule:
    # Taiwan market data ingestion before Phase 2.1 signal generation.
    # 14:05 Asia/Taipei = 06:05 UTC, Monday-Friday.
    - cron: "5 6 * * 1-5"

permissions:
  contents: read

jobs:
  market-data-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      MARKET_DATA_PROVIDER: finmind
      MARKET_DATA_LOOKBACK_DAYS: ${{ vars.MARKET_DATA_LOOKBACK_DAYS || '45' }}
      MARKET_DATA_MAX_BACKFILL_DAYS: ${{ vars.MARKET_DATA_MAX_BACKFILL_DAYS || '120' }}
      MARKET_DATA_REQUEST_SLEEP_SECONDS: ${{ vars.MARKET_DATA_REQUEST_SLEEP_SECONDS || '0.35' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Validate configuration
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          if [ -z "$FINMIND_TOKEN" ]; then
            echo "::warning::FINMIND_TOKEN is not configured; anonymous FinMind access will be attempted."
          fi

      - name: Ingest automatic market data
        run: python automation/v92/paper_trading_phase22_market_ingestion.py

      - name: Upload ingestion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-phase22-market-data-${{ github.run_number }}
          path: artifacts/paper_trading_phase22/
          if-no-files-found: warn
          retention-days: 90
