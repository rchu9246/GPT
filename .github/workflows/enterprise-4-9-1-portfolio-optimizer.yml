name: Enterprise 4.9.1 Portfolio Optimizer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-4-9-1-portfolio-optimizer
  cancel-in-progress: false

jobs:
  portfolio-optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Enterprise 4.9.1 Portfolio Optimizer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python automation/enterprise491_portfolio_optimizer.py

      - name: Verify Enterprise 4.9.1 writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: ${{ github.workspace }}/automation
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from enterprise2.client import SupabaseRestClient

          run_date = os.environ.get(
              "QUANT_RUN_DATE",
              date.today().isoformat(),
          )
          client = SupabaseRestClient()

          checks = {
              "portfolio_target_weights_v49": (
                  f"weight_date=eq.{run_date}&limit=1"
              ),
              "rebalance_plans_v49": (
                  f"plan_date=eq.{run_date}&limit=1"
              ),
              "portfolio_allocations_v48": (
                  f"allocation_date=eq.{run_date}&limit=1"
              ),
              "allocation_engine_status_v48": (
                  f"status_date=eq.{run_date}&limit=1"
              ),
              "optimization_runs_v49": (
                  f"run_date=eq.{run_date}"
                  "&run_key=eq.PORTFOLIO_OPTIMIZER&limit=1"
              ),
          }

          verified = {}
          for table, query in checks.items():
              rows = client.get(table, query)
              if not rows:
                  raise SystemExit(
                      f"No {table} record found for {run_date}"
                  )
              verified[table] = len(rows)

          trade_plans = client.get(
              "trade_plans_v49",
              f"trade_date=eq.{run_date}&limit=1000",
          )
          execution_queue = client.get(
              "execution_queue_v49",
              "order=queue_time.desc&limit=1000",
          )

          status = client.get(
              "optimization_runs_v49",
              (
                  f"run_date=eq.{run_date}"
                  "&run_key=eq.PORTFOLIO_OPTIMIZER&limit=1"
              ),
          )[0]

          print(
              "Enterprise 4.9.1 write verification passed:",
              verified,
              "trade_plans=", len(trade_plans),
              "execution_queue=", len(execution_queue),
              "status=", status.get("status"),
          )
          PY
